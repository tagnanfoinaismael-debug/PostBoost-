<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostBoost AI - Générateur Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-6">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        
        <!-- En-tête d'origine -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-2">
                <span class="text-xl">⚡</span>
                <h1 class="text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
                    PostBoost AI
                </h1>
            </div>
            <!-- Sélecteur de langue d'origine -->
            <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs">
                <span>🇫🇷</span>
                <select id="lang" class="bg-transparent text-slate-300 focus:outline-none ml-1">
                    <option value="Français">FR</option>
                    <option value="Anglais">EN</option>
                </select>
            </div>
        </div>

        <!-- Navigation d'origine -->
        <div class="grid grid-cols-4 gap-1 bg-slate-950 p-1 rounded-xl mb-6 text-xs font-semibold text-slate-400 text-center">
            <div class="bg-purple-600 text-white py-2 rounded-lg shadow">Créer</div>
            <div class="py-2 hover:text-slate-200 transition">Booster</div>
            <div class="py-2 hover:text-slate-200 transition">Crédits</div>
            <div class="py-2 hover:text-slate-200 transition">Compte</div>
        </div>

        <div class="text-center mb-6">
            <h2 class="text-xl font-bold text-slate-100">PostBoost AI</h2>
            <p class="text-xs text-slate-400 mt-1">Crée du contenu qui attire l'attention en quelques secondes.</p>
        </div>

        <!-- Formulaire de génération -->
        <form id="boostForm" class="space-y-4">
            
            <!-- Produit / Sujet -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Produit ou Sujet *</label>
                <input type="text" id="product" required placeholder="Ex. Sneakers Air Max, Écouteurs sans fil..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 transition">
            </div>

            <!-- Réseau & Ton -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Réseau social</label>
                    <select id="platform" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-purple-500 transition">
                        <option value="TikTok">TikTok</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Facebook">Facebook</option>
                        <option value="LinkedIn">LinkedIn</option>
                        <option value="Twitter / X">Twitter / X</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Ton</label>
                    <select id="tone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-purple-500 transition">
                        <option value="Dynamique et vendeur">Dynamique & Vendeur</option>
                        <option value="Professionnel">Professionnel</option>
                        <option value="Storytelling immersif">Storytelling</option>
                        <option value="Humoristique et décalé">Humoristique</option>
                        <option value="Minimaliste et percutant">Minimaliste</option>
                    </select>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- NOUVEAU : BLOC INFOS COMMERCIALES FACULTATIVES -->
            <!-- ========================================== -->
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-purple-400 uppercase tracking-wider">💰 Infos Commerciales (Facultatif)</span>
                    <span class="text-[10px] text-slate-500">L'IA n'inventera rien</span>
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="price" placeholder="Prix (ex: 12 000 FCFA)" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
                    <input type="text" id="oldPrice" placeholder="Ancien prix (ex: 15 000)" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="promo" placeholder="Promo (ex: -20%)" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
                    <input type="text" id="delivery" placeholder="Livraison (ex: Rapide 24h)" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="location" placeholder="Localisation (ex: Abidjan)" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
                    <input type="text" id="contact" placeholder="Contact / WhatsApp" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
                </div>

                <input type="text" id="link" placeholder="Lien de commande (ex: https://...)" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
            </div>
            <!-- ========================================== -->

            <!-- Bouton de soumission -->
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:opacity-90 transition transform active:scale-95 text-sm">
                ✨ Créer mon contenu (5 crédits)
            </button>
        </form>

        <!-- Zone de Résultat -->
        <div id="resultContainer" class="mt-6 hidden">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Résultat généré :</span>
                <button id="copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-purple-300 px-3 py-1.5 rounded-lg transition">
                    📋 Copier
                </button>
            </div>
            <div id="resultText" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 whitespace-pre-wrap leading-relaxed max-h-96 overflow-y-auto"></div>
        </div>

    </div>

    <!-- Script de gestion mis à jour pour transmettre les données commerciales -->
    <script>
        const form = document.getElementById('boostForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        const copyBtn = document.getElementById('copyBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Récupération des données du formulaire + infos commerciales
            const payload = {
                product: document.getElementById('product').value,
                platform: document.getElementById('platform').value,
                tone: document.getElementById('tone').value,
                lang: document.getElementById('lang').value,
                price: document.getElementById('price').value,
                oldPrice: document.getElementById('oldPrice').value,
                promo: document.getElementById('promo').value,
                delivery: document.getElementById('delivery').value,
                location: document.getElementById('location').value,
                contact: document.getElementById('contact').value,
                link: document.getElementById('link').value
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Création du contenu par l'IA en cours...";
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('/.netlify/functions/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erreur lors de la génération.');
                }

                resultText.textContent = data.text;
                resultContainer.classList.remove('hidden');
            } catch (err) {
                alert('Erreur : ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "✨ Créer mon contenu (5 crédits)";
            }
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(resultText.textContent);
            copyBtn.textContent = "✅ Copié !";
            setTimeout(() => { copyBtn.textContent = "📋 Copier"; }, 2000);
        });
    </script>
</body>
</html>
